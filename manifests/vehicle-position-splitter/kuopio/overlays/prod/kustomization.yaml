namespace: prod
resources:
  - ../../base

configMapGenerator:
  - name: vehicle-position-splitter-fi-kuopio
    behavior: merge
    literals:
      - 'FEED_MAP=[["persistent://apc-prod/source/gtfsrt-vp-fi-kuopio","fi:kuopio"],["persistent://apc-prod/source/vehicle-catalogue-fi-kuopio","fi:kuopio"]]'
      - "PINO_LOG_LEVEL=info"
      - "PULSAR_GTFSRT_SUBSCRIPTION=vehicle-position-splitter-kuopio-sub"
      - "PULSAR_APC_SUBSCRIPTION=vehicle-position-splitter-kuopio-sub"
      - "PULSAR_GTFSRT_CONSUMER_TOPICS_PATTERN=persistent://apc-prod/source/gtfsrt-vp-fi-kuopio"
      - "PULSAR_PRODUCER_TOPIC=persistent://apc-prod/source/splitted-gtfsrt-vp-fi-kuopio"
      - "PULSAR_VEHICLE_READER_TOPIC=persistent://apc-prod/source/vehicle-catalogue-fi-kuopio"
      - "PULSAR_CACHE_READER_NAME=cache-reader"
      - "PULSAR_VEHICLE_READER_NAME=vehicle-reader"
      # - "PULSAR_OAUTH2_AUDIENCE=urn:sn:pulsar:waltti:prod"
      - "PULSAR_SERVICE_URL=pulsar://pulsar-broker.pulsar.svc.cluster.local:6650"
      # Startup cache off, as in Jyvaskyla and Lahti. The 48 h default (19 Nov 2026) and a 2 h
      # window (20 Nov 2026) both crashed it at start (native pulsar-client crash during the
      # "not servicing" burst). With 0 the vehicle catalogue lookback is 70 minutes, so the
      # registry poller publishes every hour (base HTTP_SLEEP_DURATION_IN_SECONDS=3600).
      - "CACHE_WINDOW_IN_SECONDS=0"

patches:
  - path: history-limit.yaml
images:
  - name: tvvlmj/waltti-apc-vehicle-position-splitter
    digest: sha256:d679a250e23662e2cc9e44c57477d19b5b242d47611ac7b7821a7bfcf28ea96f
