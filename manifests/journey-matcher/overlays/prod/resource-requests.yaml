{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "journey-matcher"
  },
  "spec": {
    "template": {
      "spec": {
        "containers": [
          {
            "name": "journey-matcher",
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              }
            }
          }
        ]
      }
    }
  }
}
