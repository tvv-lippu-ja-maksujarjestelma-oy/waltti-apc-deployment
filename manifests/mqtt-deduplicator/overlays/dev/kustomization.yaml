namespace: dev
resources:
  - ../../base

configMapGenerator:
  - name: mqtt-deduplicator
    behavior: merge
    literals:
      - "PULSAR_CONSUMER_TOPICS_PATTERN=persistent://apc-sandbox/source/mqtt-apc-from-vehicle"
      - "PULSAR_PRODUCER_TOPIC=persistent://apc-sandbox/deduplicated/mqtt-apc-from-vehicle-deduplicated"
      - "PINO_LOG_LEVEL=debug"
      # - "PULSAR_OAUTH2_AUDIENCE=urn:sn:pulsar:waltti:alpha"
      - "PULSAR_SERVICE_URL=pulsar://pulsar-broker.pulsar.svc.cluster.local:6650"
      - "DEDUPLICATION_WINDOW_IN_SECONDS=3600"
      - "CACHE_WINDOW_IN_SECONDS=3600"
      - "PULSAR_CACHE_READER_RECEIVER_QUEUE_SIZE=10"
      - "CACHE_REBUILD_DISABLE_SEEK=true"

patches:
  - path: history-limit.yaml
  - path: resource-bursting.yaml
images:
  - name: tvvlmj/pulsar-topic-deduplicator
    newTag: edge
    digest: sha256:8762291e71234a812a515c6d73279641dd7df755028a30557e32963964ab9e0d
