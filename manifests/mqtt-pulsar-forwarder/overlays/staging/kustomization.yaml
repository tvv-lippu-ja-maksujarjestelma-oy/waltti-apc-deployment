namespace: staging
resources:
  - ../../base

configMapGenerator:
  - name: mqtt-pulsar-forwarder
    behavior: merge
    literals:
      - "MQTT_URL=mqtts://mqtts-staging.apc.waltti.fi"
      - "MQTT_CLIENT_ID_PREFIX=mqtt-pulsar-forwarder-staging"
      - "PINO_LOG_LEVEL=info"
      - "PULSAR_TOPIC=persistent://apc-staging/source/mqtt-apc-from-vehicle"
      # - "PULSAR_OAUTH2_AUDIENCE=urn:sn:pulsar:waltti:beta"
      - "PULSAR_SERVICE_URL=pulsar://pulsar-broker.pulsar.svc.cluster.local:6650"
      
patches:
  - path: history-limit.yaml
  
generators:
  - ./ksops-secret-generator.yaml
images:
  - name: tvvlmj/mqtt-pulsar-forwarder
    digest: sha256:a8b4f57d7d3c20a7f32c7f9bcbeb07fbf12f6882a287b0948f42cb5a5a666ef5
